<h1>Guilherme Ribeiro</h1>
<p><strong>CMO &amp; Head of Product · Product Designer</strong> — Praia Grande · SP · Brazil</p>
<p>Guilherme Ribeiro is a product designer and Head of Product based in Praia Grande · SP · Brazil. He took Reune, a restaurant operations SaaS, from an idea to a funded company, on more than thirty restaurants of field research, and owns its brand, its product design and its front-end. He designs at library scale, including a thirty-four component design system with a written governance model, and writes the code that ships it. Trained in consumer neuroscience at Copenhagen Business School, cognitive psychology at Cambridge and neuroscience at Harvard.</p>
<p>Designer at the intersection of product, neuroscience and code — engineering interfaces where usability, scalability and human behaviour converge.</p>
<h2>Selected work</h2>
<section><h3>Reune Digital</h3>
<p><em>Reune Digital · 2024 — present · Head of Product · Design · Brand</em></p>
<p>A management system for Brazilian restaurants, taken from an idea to a funded company. Orders, tables, till, stock, kitchen and delivery in one place, with five sales channels landing in a single queue.</p>
<p>Research first: more than thirty restaurants visited before anything was drawn. I am Head of Product, and the brand, the product design and the landing page are mine.</p>
<p>SaaS, Product Strategy, Research, Brand, Front-end</p></section>
<section><h3>Cosa Nostra</h3>
<p><em>Self-initiated · Design Systems</em></p>
<p>A complete design system in the Apple register — 34 documented components, three token layers, both themes drawn, and a governance section that says who gets to change it.</p>
<p>Twenty-four numbered sections carry it from colour and grid through to versioning. The library ships as specified components with props, states and dark mode rather than as a swatch sheet.</p>
<p>Design System, Tokens, Accessibility, Governance</p></section>
<section><h3>Magic Sprite</h3>
<p><em>Self-initiated · Design &amp; Development</em></p>
<p>A pixel art editor and animation tool. I designed it and I wrote it, aimed at the friction that makes spriting and frame-by-frame animation slower than the drawing itself.</p>
<p>Design and code are both mine here, which is the reason it sits on this list rather than a shelf. The target is the gap between having an idea for a sprite and watching it move: the repetitive setup, the fiddly frame work, and the small steps that break concentration between the two.</p>
<p>Pixel Art, Animation, Creative Tools, Design &amp; Code</p></section>
<section><h3>Axis</h3>
<p><em>Product Designer</em></p>
<p>Cement plant automation — quarry to dispatch on a single spine, so an operator moves along the process instead of between vendor screens.</p>
<p>Neutral grey carries all the structure. One pastel cyan carries meaning, and only three: a value under live control, the active navigation item, or a number that needs a decision. Nothing else is coloured.</p>
<p>Industrial, SCADA, Data Density, Dark UI</p></section>
<h2>Experience</h2><ul>
<li><strong>CMO &amp; Head of Product</strong>, Reune Digital (PRESENT) — Owning product direction and marketing for the company — strategy, roadmap and team leadership, with design still in my own hands.</li>
<li><strong>Product Designer</strong>, Azape (2024 — 2025) — Design &amp; UX strategy for published digital products and internal platforms across large-scale Brazilian companies.</li>
<li><strong>UX/UI Designer</strong>, Mamba Digital (2021 — 2022) — E-commerce UX powered by neuromarketing — flows, high-fidelity UI and a scalable component library.</li>
<li><strong>UX/UI Designer</strong>, Universidade Libertária (VOLUNTEER) — Volunteer work — designed a DAO mobile app and website from scratch with a team of three front-end developers.</li>
</ul>
